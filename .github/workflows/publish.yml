name: 构建并发布到 npm

# 触发方式：
#   1. 推送版本 tag（v*）→ 自动构建并发布到 npm 官方仓库（registry.npmjs.org）
#   2. 手动触发（workflow_dispatch）→ 可选演练 / 补发
#
# 本工作流不做任何「往 GitHub 推东西」的事：
#   * 不 push 代码、不提交 commit、不创建 Release；
#   * 不上传 / 不下载构建产物（没有 upload-artifact / download-artifact）；
#   * 不发布任何文件到 GitHub。
#   tarball 只在 runner 内存/临时目录中存在，发布完成即删除。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '发布前演练（npm publish --dry-run，不会真正上传）'
        type: boolean
        default: false
      provenance:
        description: '启用 npm provenance 签名（需仓库为公开仓库）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 构建并发布到 npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/dsh-linux-desktop-use
    permissions:
      contents: read
      id-token: write # npm provenance 需要（仅在开启 provenance 时使用）
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 校验 npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::未在仓库 Secrets 中配置 NPM_TOKEN，无法发布"
            exit 1
          fi
          echo "NPM_TOKEN 已配置"

      - name: 校验 tag 与 package.json 版本一致
        # 仅 tag 触发时校验：tag 形如 v1.10.0，package.json 版本必须是 1.10.0，
        # 防止「tag 指向旧版本号」把已发布过的版本再发一遍。
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json 版本: ${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG}" != "v${VERSION}" ]; then
              echo "::error::tag ${TAG} 与 package.json 版本 ${VERSION} 不一致（期望 v${VERSION}）"
              exit 1
            fi
            echo "tag ${TAG} 与 package.json 版本一致"
          fi

      - name: 语法检查
        run: |
          set -euo pipefail
          for f in index.js client.js lib/*.js; do
            node --check "$f"
            echo "ok: $f"
          done

      - name: 校验 package.json
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json');
            if (p.private) { console.error('package.json 仍为 private:true，无法发布'); process.exit(1); }
            if (!p.version) { console.error('缺少 version'); process.exit(1); }
            console.log('包名:', p.name, '版本:', p.version);"

      - name: 检查版本是否已发布
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-linux-desktop-use@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::版本 ${VERSION} 已发布过，请先提升 package.json 版本号"
            exit 1
          fi
          echo "版本 ${VERSION} 尚未发布，可以继续"

      - name: 构建 tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          TARBALL=$(ls dist/*.tgz | head -n1)
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "待发布 tarball: ${TARBALL}"

      - name: 输出包内容清单
        run: tar -tzf "${{ steps.pack.outputs.tarball }}"

      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          set -euo pipefail
          TARBALL="${{ steps.pack.outputs.tarball }}"
          # 必须以 ./ 开头：npm 会把 "dist/xxx.tgz" 当成 GitHub 简写（owner/repo），
          # 转成 ssh://git@github.com/dist/xxx.tgz.git 去克隆，
          # CI 无 SSH key 时必然报 "Permission denied (publickey)"（exit code 128）。
          TARBALL="./${TARBALL}"
          if [ "${DRY_RUN}" = "true" ]; then
            npm publish "${TARBALL}" --dry-run --access public
            echo "::notice::dry_run=true：本次只做发布演练，未真正上传到 npm"
            exit 0
          fi
          if [ "${PROVENANCE}" = "true" ]; then
            npm publish "${TARBALL}" --access public --provenance
          else
            npm publish "${TARBALL}" --access public
          fi

      - name: 校验发布结果
        # dry_run 时并未真正发布到 npm，回查 registry 必然 404，跳过本步
        if: ${{ inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # npm registry 存在传播延迟（新版本通常几十秒~几分钟才可被回查查到），
          # 之前只重试 5 次 × 5 秒会在发布其实已成功的情况下误报失败。
          # 显式指定 registry，避免继承宿主 .npmrc 指向的镜像源而查不到新版本。
          MAX_RETRY=20
          for i in $(seq 1 $MAX_RETRY); do
            if npm view "dsh-linux-desktop-use@${VERSION}" version dist.tarball \
                 --registry=https://registry.npmjs.org; then
              echo "::notice::版本 ${VERSION} 已在 npm registry 上确认发布成功"
              exit 0
            fi
            echo "::notice::第 ${i}/${MAX_RETRY} 次回查未查到版本 ${VERSION}，15 秒后重试"
            sleep 15
          done
          echo "::error::发布后在 npm registry 上未查到版本 ${VERSION}（发布可能仍已成功，请到 npmjs.com 手动确认）"
          exit 1

      - name: 清理构建产物
        # tarball 只用于发布，不上传、不保留、不发布到 GitHub；发布后立即删除。
        if: ${{ always() }}
        run: rm -rf dist
